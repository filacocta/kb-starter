# kb-relink curated tag-enrichment rules
# Populated 2026-05-10 from live vault tag inventory and anchor map.
#
# Strategy: via_anchor rules are the most precise — they require
# VIA_ANCHOR_TRIGGER_MIN (default 2) distinct anchors from the list to be
# present in a note before the tag fires. Phrase rules require
# PHRASE_TRIGGER_MIN (default 5) safe-zone matches. Both err conservative.
#
# Tags omitted intentionally:
#   #logic, #software, #hardware, #python, #api, #open-source — too generic;
#     phrase triggers would fire on unrelated notes.
#   #synthesis, #source, #worklog — structural; set at creation, not enriched.
#   Singleton topic tags (#aesthetics, etc.) — already set at note creation.

