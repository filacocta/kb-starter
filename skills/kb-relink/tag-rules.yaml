# Curated tag-enrichment fixtures for the portable starter relink driver.
#
# Phrase triggers are conservative; via_anchor requires multiple distinct
# anchors. Starter users should replace these synthetic examples in their
# installed copy with a reviewed taxonomy.
#
# Tags omit the leading # in frontmatter, but rule keys keep it for clarity.

"#demo-topic":
  phrases:
    - "Demo Topic"
    - "demo topic"
  via_anchor:
    - demo-topic
    - example-project

"#workflow-pattern":
  phrases:
    - "workflow pattern"
    - "reusable workflow"
  via_anchor:
    - example-project
    - example-tool
