# Curated alias fixtures for the portable starter relink driver.
#
# Keep mappings explicit and scoped to notes in the user's KB. Add a user's
# own aliases in their installed copy; do not put private project taxonomy or
# account data in a starter checkout.
#
# Format:
#   anchor-slug:
#     - "Phrase"

example-project:
  - "Example Project"
  - "example project"

example-tool:
  - "Example Tool"
  - "the example tool"

demo-topic:
  - "Demo Topic"
