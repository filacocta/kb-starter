# ---- known slug collisions (do NOT add aliases until resolved) ---------------
# These slugs exist in two topics with different content. kb-relink skips them.
# Resolve by consolidating the shorter note into the longer one and updating
# backlinks, then add aliases here for the surviving note.
#
# jorge-luis-borges  — literature-and-metaphysics (72 lines, canonical)
#                      vs folklore-and-bestiaries (21 lines, stub)
# rumi               — mysticism (27 lines) vs celestial-spheres (25 lines)
# hildegard-of-bingen — mysticism (29 lines) vs celestial-spheres (25 lines)
# viriditas          — mysticism (29 lines) vs celestial-spheres (21 lines)
# raspberry-pi       — diy-electronics (25 lines) vs software-defined-radio (23 lines)

