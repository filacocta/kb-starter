[project]
name = "kb-feed"
version = "0.1.0"
description = "Telegram supergroup to KB reading-list ingestion daemon."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=21,<22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
kb-feed = "kb_feed.bot:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
