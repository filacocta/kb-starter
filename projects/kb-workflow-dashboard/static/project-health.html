<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Project Health · KB Dashboard</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
      .ph-summary { display:flex; gap:.75rem; flex-wrap:wrap; margin:.25rem 0 1rem; }
      .ph-pill { padding:.3rem .7rem; border-radius:999px; font-weight:600; font-size:.85rem;
                 border:1px solid var(--border, #2a2f3a); }
      .ph-pill.green  { background:rgba(46,160,67,.15);  color:#3fb950; }
      .ph-pill.yellow { background:rgba(210,153,34,.15); color:#d29922; }
      .ph-pill.red    { background:rgba(248,81,73,.15);  color:#f85149; }
      .ph-pill.stale  { background:rgba(139,148,158,.15); color:#8b949e; }
      .ph-project { margin-bottom:1.1rem; }
      .ph-project h2 { display:flex; align-items:center; gap:.5rem; }
      .ph-dot { width:.7rem; height:.7rem; border-radius:50%; display:inline-block; }
      .ph-dot.green{background:#3fb950;} .ph-dot.yellow{background:#d29922;} .ph-dot.red{background:#f85149;}
      .ph-metric { border-top:1px solid var(--border, #2a2f3a); padding:.6rem 0; }
      .ph-metric:first-of-type { border-top:none; }
      .ph-metric-head { display:flex; align-items:baseline; gap:.6rem; flex-wrap:wrap; }
      .ph-metric-name { font-weight:600; }
      .ph-badge { font-size:.72rem; font-weight:700; text-transform:uppercase; padding:.1rem .45rem;
                  border-radius:4px; letter-spacing:.03em; }
      .ph-badge.green{background:rgba(46,160,67,.18);color:#3fb950;}
      .ph-badge.yellow{background:rgba(210,153,34,.18);color:#d29922;}
      .ph-badge.red{background:rgba(248,81,73,.18);color:#f85149;}
      .ph-summary-text { color:var(--muted,#8b949e); }
      .ph-detail { margin:.35rem 0 0; white-space:pre-wrap; font-family:ui-monospace,SFMono-Regular,monospace;
                   font-size:.8rem; color:var(--muted,#8b949e); max-height:16rem; overflow:auto; }
      .ph-updated { font-size:.72rem; color:var(--muted,#8b949e); }
      .ph-empty { color:var(--muted,#8b949e); padding:1rem 0; }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand-block">
        <div class="brand-line">
          <h1>Project Health</h1>
          <span class="mode-chip">Read-only</span>
        </div>
        <p id="subhead">Operational metrics across projects · Loading…</p>
      </div>
      <nav class="top-actions" aria-label="Dashboard actions">
        <a class="top-link top-action" href="/index.html">← Dashboard</a>
        <button class="top-action" id="refresh" type="button" title="Refresh">Refresh</button>
      </nav>
    </header>
    <main>
      <section class="band">
        <div class="ph-summary" id="ph-summary"></div>
        <div id="ph-projects"><p class="ph-empty">Loading…</p></div>
      </section>
    </main>
    <script src="/project-health.js"></script>
  </body>
</html>
