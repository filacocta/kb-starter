<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KB Lint — Broken Links</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
      .lint-badge { font-weight: 600; }
      .lint-badge.errors { color: #d63; }
      .lint-badge.warnings { color: #c80; }
      .lint-badge.clean { color: #2a7; }
      [data-theme="dark"] .lint-badge.errors { color: #f87; }
      [data-theme="dark"] .lint-badge.warnings { color: #fb3; }
      [data-theme="dark"] .lint-badge.clean { color: #4c9; }
      .file-group {
        border: 1px solid var(--border, #ddd);
        border-radius: 6px;
        margin-bottom: .5rem;
        overflow: hidden;
      }
      .file-group summary {
        cursor: pointer;
        padding: .6rem 1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: monospace;
        font-size: .85rem;
        list-style: none;
        user-select: none;
      }
      .file-group summary::-webkit-details-marker { display: none; }
      .file-group[open] > summary { border-bottom: 1px solid var(--border, #ddd); }
      .file-group-meta { display: flex; align-items: center; gap: .75rem; flex-shrink: 0; margin-left: 1rem; }
      .badge-count {
        background: #fde8e8;
        color: #d63;
        border-radius: 999px;
        padding: 1px 8px;
        font-size: .78rem;
        font-weight: 700;
      }
      [data-theme="dark"] .badge-count { background: #4a1a1a; color: #f87; }
      .copy-btn {
        font-size: .75rem;
        padding: 2px 8px;
        cursor: pointer;
        border: 1px solid var(--border, #ddd);
        border-radius: 4px;
        background: transparent;
        color: var(--fg-muted, #888);
        white-space: nowrap;
      }
      .copy-btn:hover { opacity: .7; }
      .lint-items { padding: .25rem 1rem .5rem; }
      .lint-item {
        padding: .45rem 0;
        border-bottom: 1px solid var(--border-faint, #f0f0f0);
      }
      .lint-item:last-child { border-bottom: none; }
      [data-theme="dark"] .lint-item { border-color: #2a2a2a; }
      .lint-target { font-family: monospace; font-size: .85rem; font-weight: 600; }
      .lint-line { font-size: .78rem; color: var(--fg-muted, #888); margin-left: .4rem; }
      .lint-context {
        font-size: .78rem;
        color: var(--fg-muted, #888);
        margin-top: 3px;
        font-family: monospace;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 100%;
      }
      .warn-details summary {
        cursor: pointer;
        font-size: .9rem;
        padding: .3rem 0;
        list-style: none;
      }
      .warn-details summary::-webkit-details-marker { display: none; }
      .no-errors { padding: 1rem; color: var(--fg-muted, #888); }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand-block">
        <div class="brand-line">
          <h1>KB Lint</h1>
          <span class="mode-chip">Broken Links</span>
        </div>
        <p id="subhead">Loading…</p>
      </div>
      <nav class="top-actions" aria-label="Dashboard actions">
        <a class="top-link" href="/">Dashboard</a>
        <a class="top-link top-action" href="/workflow-global.html">Map: Global</a>
        <a class="top-link top-action" href="/workflow-hybrid.html">Map: Hybrid</a>
        <a class="top-link top-action" href="/getting-started.html">Guide</a>
        <button class="theme-toggle" id="theme-toggle" type="button">Dark</button>
        <button class="top-action" id="refresh" type="button">Refresh</button>
      </nav>
    </header>

    <main>
      <section class="band">
        <div class="section-title">
          <h2>Broken Links</h2>
          <span class="hint" id="lint-summary">Loading…</span>
        </div>
        <div id="errors-container"><div class="muted">Running kb-lint…</div></div>
      </section>

      <section class="band" id="warnings-section" style="display:none">
        <div class="section-title">
          <h2>Warnings</h2>
        </div>
        <div id="warnings-container"></div>
      </section>
    </main>

    <script>
      // Theme (mirrors app.js)
      const THEME_KEY = 'kb-theme';
      function applyTheme(t) {
        document.documentElement.setAttribute('data-theme', t);
        document.getElementById('theme-toggle').textContent = t === 'dark' ? 'Light' : 'Dark';
      }
      applyTheme(localStorage.getItem(THEME_KEY) || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        localStorage.setItem(THEME_KEY, next);
        applyTheme(next);
      });

      function esc(s) {
        return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }

      function copyPath(e, path) {
        e.stopPropagation();
        const btn = e.target;
        navigator.clipboard.writeText(path).then(() => {
          btn.textContent = 'Copied!';
          setTimeout(() => btn.textContent = 'Copy path', 1500);
        }).catch(() => {
          btn.textContent = 'Failed';
          setTimeout(() => btn.textContent = 'Copy path', 1500);
        });
      }

      async function load(bust) {
        document.getElementById('lint-summary').textContent = 'Running…';
        document.getElementById('errors-container').innerHTML = '<div class="muted">Running kb-lint…</div>';
        try {
          const res = await fetch(bust ? '/api/lint?bust=1' : '/api/lint');
          render(await res.json());
        } catch (e) {
          document.getElementById('lint-summary').textContent = 'Fetch failed: ' + e.message;
        }
      }

      function render(data) {
        const { errors = [], warnings = [], summary = {} } = data;
        const ts = new Date().toLocaleTimeString();
        const errCount = summary.errors ?? errors.length;
        const warnCount = summary.warnings ?? warnings.length;
        const filesNote = summary.files_scanned ? ` · ${summary.files_scanned} files scanned` : '';

        document.getElementById('subhead').textContent = summary.kb_root ? 'KB: ' + summary.kb_root : '';

        const sumEl = document.getElementById('lint-summary');
        if (errCount === 0 && warnCount === 0) {
          sumEl.innerHTML = `<span class="lint-badge clean">✓ Clean</span> · last checked ${ts}${filesNote}`;
        } else {
          const parts = [];
          if (errCount > 0) parts.push(`<span class="lint-badge errors">${errCount} error${errCount !== 1 ? 's' : ''}</span>`);
          if (warnCount > 0) parts.push(`<span class="lint-badge warnings">${warnCount} warning${warnCount !== 1 ? 's' : ''}</span>`);
          sumEl.innerHTML = parts.join(' · ') + ` · last checked ${ts}${filesNote}`;
        }

        // Group errors by file
        const byFile = {};
        for (const e of errors) {
          (byFile[e.file] = byFile[e.file] || []).push(e);
        }

        const container = document.getElementById('errors-container');
        const fileEntries = Object.entries(byFile);
        if (fileEntries.length === 0) {
          container.innerHTML = '<div class="no-errors panel">No broken links found.</div>';
        } else {
          container.innerHTML = fileEntries.map(([file, items]) => {
            const rows = items.map(item => {
              const label = item.target
                ? `<span class="lint-target">${esc(item.target)}</span>`
                : `<span class="lint-target">${esc(item.message)}</span>`;
              const lineNum = item.line ? `<span class="lint-line">:${item.line}</span>` : '';
              const ctx = item.context ? `<div class="lint-context">↳ ${esc(item.context)}</div>` : '';
              return `<div class="lint-item">${label}${lineNum}${ctx}</div>`;
            }).join('');
            const fileJson = JSON.stringify(file);
            return `<details class="file-group" open>
  <summary>
    <span>${esc(file)}</span>
    <span class="file-group-meta">
      <span class="badge-count">${items.length}</span>
      <button class="copy-btn" onclick="copyPath(event, ${fileJson})">Copy path</button>
    </span>
  </summary>
  <div class="lint-items">${rows}</div>
</details>`;
          }).join('');
        }

        // Warnings
        const warnSection = document.getElementById('warnings-section');
        const warnContainer = document.getElementById('warnings-container');
        if (warnings.length > 0) {
          warnSection.style.display = '';
          const rows = warnings.map(w => `<div class="lint-item">
  <span class="lint-target">${esc(w.file)}</span>${w.line ? `<span class="lint-line">:${w.line}</span>` : ''}
  <div class="lint-context">${esc(w.message)}</div>
</div>`).join('');
          warnContainer.innerHTML = `<details class="warn-details"><summary>${warnings.length} warning${warnings.length !== 1 ? 's' : ''} ▸</summary><div class="lint-items">${rows}</div></details>`;
        } else {
          warnSection.style.display = 'none';
        }
      }

      document.getElementById('refresh').addEventListener('click', () => load(true));
      load(false);
    </script>
  </body>
</html>
