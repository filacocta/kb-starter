<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Claude Usage — KB Dashboard</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
      .usage-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 1.25rem;
        margin-bottom: 2rem;
      }
      .account-card {
        border: 1px solid var(--border, #ddd);
        border-radius: 10px;
        padding: 1.25rem 1.4rem;
        display: flex;
        flex-direction: column;
        gap: .6rem;
        position: relative;
      }
      .account-card.is-active {
        border-color: var(--accent, #4c8);
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent, #4c8) 20%, transparent);
      }
      .active-badge {
        position: absolute;
        top: .75rem;
        right: .9rem;
        font-size: .67rem;
        font-weight: 700;
        letter-spacing: .06em;
        text-transform: uppercase;
        background: var(--accent, #4c8);
        color: #fff;
        padding: .15rem .5rem;
        border-radius: 4px;
      }
      .account-email {
        font-weight: 600;
        font-size: 1rem;
        margin-right: 4rem; /* clear active badge */
      }
      .account-org {
        font-size: .78rem;
        color: var(--muted, #888);
        margin-top: -.3rem;
      }
      .quota-row {
        display: flex;
        flex-direction: column;
        gap: .2rem;
        margin-top: .2rem;
      }
      .quota-label-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: .8rem;
      }
      .quota-label { font-weight: 600; }
      .quota-meta { color: var(--muted, #888); font-size: .75rem; }
      .bar-track {
        height: 8px;
        border-radius: 4px;
        background: var(--border, #e0e0e0);
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        border-radius: 4px;
        transition: width .4s ease;
      }
      .bar-fill.green  { background: #2a9; }
      .bar-fill.yellow { background: #e8a000; }
      .bar-fill.red    { background: #d44; }

      .quota-resets {
        font-size: .73rem;
        color: var(--muted, #888);
        text-align: right;
      }
      .oauth-row {
        font-size: .75rem;
        color: var(--muted, #888);
        border-top: 1px solid var(--border, #eee);
        padding-top: .5rem;
        margin-top: .1rem;
      }
      .exhausted-banner {
        background: #fde8e8;
        color: #8a1a1a;
        border-radius: 6px;
        padding: .4rem .7rem;
        font-size: .78rem;
        font-weight: 600;
        text-align: center;
      }
      [data-theme="dark"] .exhausted-banner {
        background: #3d1010;
        color: #f08080;
      }

      /* Sessions table */
      .sessions-section { margin-bottom: 2rem; }
      .sessions-section h2 {
        font-size: .75rem;
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: var(--muted, #888);
        margin: 0 0 .75rem;
        padding-bottom: .3rem;
        border-bottom: 1px solid var(--border, #ddd);
      }
      .sessions-table {
        width: 100%;
        border-collapse: collapse;
        font-size: .85rem;
      }
      .sessions-table th {
        text-align: left;
        font-size: .72rem;
        font-weight: 700;
        letter-spacing: .05em;
        text-transform: uppercase;
        color: var(--muted, #888);
        padding: .3rem .5rem;
        border-bottom: 1px solid var(--border, #ddd);
      }
      .sessions-table td {
        padding: .4rem .5rem;
        border-bottom: 1px solid var(--border, #eee);
        font-family: monospace;
        font-size: .8rem;
        word-break: break-all;
      }
      .sessions-table td:last-child { font-family: sans-serif; text-align: center; }

      /* Upgrade notice */
      .upgrade-notice {
        display: inline-flex;
        align-items: center;
        gap: .5rem;
        background: #fff8e0;
        color: #7a5500;
        border: 1px solid #e8d060;
        border-radius: 6px;
        padding: .4rem .8rem;
        font-size: .8rem;
        margin-bottom: 1.25rem;
      }
      [data-theme="dark"] .upgrade-notice {
        background: #3d3000;
        color: #f0c040;
        border-color: #806010;
      }

      .refresh-row {
        display: flex;
        align-items: center;
        gap: .75rem;
        margin-bottom: 1.25rem;
        font-size: .85rem;
        color: var(--muted, #888);
      }
      .auto-label {
        font-size: .75rem;
        color: var(--muted, #888);
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand-block">
        <div class="brand-line">
          <h1>Claude Usage</h1>
          <span class="mode-chip">Live</span>
        </div>
        <p id="subhead">5h and 7d quota across all Claude accounts</p>
      </div>
      <nav class="top-actions" aria-label="Dashboard actions">
        <a class="top-link top-action" href="/">Home</a>
        <a class="top-link top-action" href="/project-health.html">Project Health</a>
        <a class="top-link top-action" href="/lan-directory.html">LAN</a>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch color theme">Dark</button>
        <button class="top-action" id="refresh-btn" type="button">Refresh</button>
      </nav>
    </header>

    <main>
      <div class="refresh-row">
        <span id="status-line">Loading…</span>
        <span class="auto-label" id="auto-label"></span>
      </div>
      <div id="upgrade-notice"></div>
      <div class="usage-grid" id="accounts-grid"></div>

      <div class="sessions-section">
        <h2>Running Sessions</h2>
        <table class="sessions-table">
          <thead>
            <tr><th>Path</th><th>Type</th><th>Sessions</th></tr>
          </thead>
          <tbody id="sessions-body"><tr><td colspan="3">—</td></tr></tbody>
        </table>
      </div>
    </main>

    <script>
      // ── Helpers ───────────────────────────────────────────────────────────────
      function barColor(pct) {
        if (pct >= 95) return "red";
        if (pct >= 70) return "yellow";
        return "green";
      }

      function quotaBlock(label, q) {
        if (!q) return "";
        const pct = Math.min(q.pct, 100);
        const cls = barColor(pct);
        return `
          <div class="quota-row">
            <div class="quota-label-row">
              <span class="quota-label">${label}</span>
              <span class="quota-meta">${pct}% used</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill ${cls}" style="width:${pct}%"></div>
            </div>
            <div class="quota-resets">resets ${q.resets_at} &nbsp;(in ${q.resets_in})</div>
          </div>`;
      }

      function renderAccounts(data) {
        const grid = document.getElementById("accounts-grid");
        if (!data.accounts || !data.accounts.length) {
          grid.innerHTML = "<p>No accounts found — is cswap installed?</p>";
          return;
        }
        grid.innerHTML = data.accounts.map(a => {
          const active = a.active;
          const q5 = a.quota_5h;
          const exhausted = q5 && q5.pct >= 100;
          return `
            <div class="account-card ${active ? "is-active" : ""}">
              ${active ? '<span class="active-badge">Active</span>' : ""}
              <div class="account-email">${a.email}</div>
              <div class="account-org">${a.org}</div>
              ${exhausted ? `<div class="exhausted-banner">5h quota exhausted — resets in ${q5.resets_in}</div>` : ""}
              ${quotaBlock("5-hour window", a.quota_5h)}
              ${quotaBlock("7-day window", a.quota_7d)}
              ${a.oauth ? `<div class="oauth-row">OAuth: ${a.oauth}</div>` : ""}
            </div>`;
        }).join("");
      }

      function renderSessions(data) {
        const body = document.getElementById("sessions-body");
        if (!data.sessions || !data.sessions.length) {
          body.innerHTML = "<tr><td colspan=\"3\">No running instances</td></tr>";
          return;
        }
        body.innerHTML = data.sessions.map(s =>
          `<tr>
            <td>${s.path}</td>
            <td>${s.type}</td>
            <td>${s.count}</td>
          </tr>`
        ).join("");
      }

      function renderUpgrade(data) {
        const el = document.getElementById("upgrade-notice");
        el.innerHTML = data.upgrade_available
          ? `<div class="upgrade-notice">cswap ${data.upgrade_available} available — run <code>cswap --upgrade</code></div>`
          : "";
      }

      // ── Fetch & render ────────────────────────────────────────────────────────
      let autoTimer = null;
      const AUTO_MS = 30_000;

      async function load() {
        const btn = document.getElementById("refresh-btn");
        const status = document.getElementById("status-line");
        btn.disabled = true;
        try {
          const res = await fetch("/api/claude-usage");
          const data = await res.json();
          if (data.error) {
            status.textContent = `Error: ${data.error}`;
          } else {
            renderAccounts(data);
            renderSessions(data);
            renderUpgrade(data);
            const ts = new Date(data.generated_at).toLocaleTimeString();
            const total = (data.sessions || []).reduce((s, r) => s + r.count, 0);
            status.textContent = `${data.accounts.length} accounts · ${total} session${total !== 1 ? "s" : ""} · updated ${ts}`;
          }
        } catch (e) {
          status.textContent = `Fetch error: ${e.message}`;
        }
        btn.disabled = false;
      }

      function startAuto() {
        clearInterval(autoTimer);
        autoTimer = setInterval(load, AUTO_MS);
        const label = document.getElementById("auto-label");
        label.textContent = `auto-refresh every ${AUTO_MS / 1000}s`;
      }

      // ── Theme ─────────────────────────────────────────────────────────────────
      const THEME_KEY = "kb-theme";
      const toggle = document.getElementById("theme-toggle");
      function applyTheme(t) {
        document.documentElement.setAttribute("data-theme", t);
        toggle.textContent = t === "dark" ? "Light" : "Dark";
        localStorage.setItem(THEME_KEY, t);
      }
      applyTheme(localStorage.getItem(THEME_KEY) || "light");
      toggle.addEventListener("click", () =>
        applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark")
      );

      // ── Init ──────────────────────────────────────────────────────────────────
      document.getElementById("refresh-btn").addEventListener("click", load);
      load();
      startAuto();
    </script>
  </body>
</html>
